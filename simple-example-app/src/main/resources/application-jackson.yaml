# 这里也是统一的配置，对spring web 的@RequestBody与@ResponseBody 这些进行json的序列化与反序列化的一些问题
spring:
  jackson:
    # 配置对默认的@RequestBody和@ResponseBody的json配置
    # 这样我们就不需要在每一个日期上面添加@format 注解就可以将其按下面的配置进行格式化
    date-format: yyyy-MM-dd HH:mm:ss
    # 时区
    time-zone: Asia/Kolkata
    default-property-inclusion: non_null # 非空属性才序列化
    deserialization:
      fail-on-unknown-properties: false # 未知key 在反序列化时不抛异常
    serialization:
      # 格式化输出
      indent-output: true
      # 忽略无法转换的对象
      fail-on-empty-beans: false
      # 序列化时，使用时间戳的格式 进行序列化，而不是字符串。
      write-dates-as-timestamps: false
    parser:
      # 允许出现特殊字符和转义符
      allow-unquoted-control-chars: true
      # 允许出现单引号
      allow-single-quotes: true

